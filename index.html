<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connect Gym · Joining sentences in Russian A1–A2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700..800&family=Golos+Text:wght@400..900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#fffaf7; --surface:#fff; --ink:#0d0d0d; --muted:#4d4a4b;
  --pink:#fe98c0; --green:#80eb3d; --blue:#3dd0eb; --red:#eb583d;
  --yellow:#ffe14d; --lilac:#c4a5ff;
  --border:3px solid var(--ink); --radius:18px;
  --shadow:6px 6px 0 var(--ink); --shadow-sm:4px 4px 0 var(--ink); --shadow-lg:9px 9px 0 var(--ink);
  --font-display:"Bricolage Grotesque","Golos Text","Arial Black",system-ui,sans-serif;
  --font-ru:"Golos Text",system-ui,sans-serif;
  --font-body:"DM Sans","Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --max:1120px; color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:1.05rem;line-height:1.55;-webkit-font-smoothing:antialiased}
::selection{background:var(--pink)}
a{color:inherit}
button,select{font:inherit;color:inherit}
.container{max-width:var(--max);margin:0 auto;padding:0 16px}
.muted{color:var(--muted)}
.ru{font-family:var(--font-ru)}

.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 22px;border:var(--border);border-radius:999px;background:var(--pink);font-family:var(--font-display);font-size:1rem;font-weight:800;text-decoration:none;cursor:pointer;box-shadow:var(--shadow-sm);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translate(-2px,-2px);box-shadow:var(--shadow)}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn--ghost{background:var(--surface)} .btn--green{background:var(--green)} .btn--blue{background:var(--blue)} .btn--red{background:var(--red)} .btn--yellow{background:var(--yellow)}
.btn--sm{padding:6px 14px;font-size:.9rem;box-shadow:3px 3px 0 var(--ink)}
.btn:focus-visible,.nav__link:focus-visible,.tile:focus-visible,.choice:focus-visible{outline:3px dashed var(--ink);outline-offset:4px}
.icon-btn{border:2px solid var(--ink);border-radius:999px;background:var(--surface);width:38px;height:38px;display:inline-grid;place-items:center;cursor:pointer;font-size:1rem;box-shadow:2px 2px 0 var(--ink)}

.header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:var(--border)}
.header__inner{display:flex;align-items:center;justify-content:space-between;gap:10px 18px;min-height:68px;padding-block:10px;flex-wrap:wrap}
.brand{padding:4px 12px;border:var(--border);border-radius:10px;background:var(--green);box-shadow:var(--shadow-sm);font-family:var(--font-display);font-size:1.15rem;font-weight:800;letter-spacing:-.02em;text-decoration:none;transform:rotate(-2deg);white-space:nowrap}
.nav{display:flex;flex-wrap:wrap;gap:4px}
.nav__link{padding:5px 11px;border:2px solid transparent;border-radius:999px;font-weight:700;text-decoration:none;font-size:.93rem;transition:background .12s,border-color .12s}
.nav__link:hover{background:var(--surface);border-color:var(--ink)}
.nav__link.is-active{background:var(--ink);color:var(--bg)}
.header__tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:flex;border:var(--border);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:5px 12px;font-weight:800;font-family:var(--font-display);cursor:pointer}
.seg button+button{border-left:2px solid var(--ink)}
.seg button.is-on{background:var(--blue)}
.topic-select{padding:6px 12px;border:var(--border);border-radius:999px;background:var(--surface);font-weight:700;cursor:pointer;max-width:200px}
.xp{padding:5px 12px;border:var(--border);border-radius:999px;background:var(--pink);font-family:var(--font-display);font-weight:800;box-shadow:3px 3px 0 var(--ink);transform:rotate(3deg);white-space:nowrap}
.xp.bump{animation:bump .4s}
@keyframes bump{50%{transform:rotate(-4deg) scale(1.2)}}

.marquee{display:flex;overflow:hidden;border-block:var(--border);background:var(--ink);color:var(--green);font-family:var(--font-ru);font-size:clamp(1.1rem,3vw,1.6rem);font-weight:800;white-space:nowrap;user-select:none}
.marquee__track{display:flex;flex-shrink:0;align-items:center;gap:24px;padding:14px 12px;animation:marquee 45s linear infinite}
.marquee__star{color:var(--pink)}
@keyframes marquee{to{transform:translateX(-100%)}}
@media (prefers-reduced-motion:reduce){.marquee__track{animation:none}html{scroll-behavior:auto}}

.section{padding:56px 0 72px}
.heading{margin:0 0 12px;font-family:var(--font-display);font-size:clamp(2.4rem,7vw,4.5rem);font-weight:800;line-height:.95;letter-spacing:-.04em}
.lead{margin:0 0 28px;font-size:1.15rem;font-weight:500;max-width:62ch}

.hero-wrap{padding:48px 0 64px}
.hero{display:flex;align-items:center;gap:56px;padding:40px;border:var(--border);border-radius:28px;background:var(--surface);box-shadow:var(--shadow-lg)}
.hero__media{position:relative;flex-shrink:0}
.hero__avatar{display:grid;place-items:center;width:240px;aspect-ratio:4/5;border:var(--border);border-radius:28px;background:linear-gradient(135deg,var(--green),var(--yellow));box-shadow:var(--shadow-lg);transform:rotate(-3deg);font-family:var(--font-ru);font-size:8.5rem;font-weight:900;line-height:1}
.hero__sticker{position:absolute;right:-26px;bottom:-20px;padding:9px 16px;border:var(--border);border-radius:999px;background:var(--pink);box-shadow:var(--shadow-sm);font-family:var(--font-display);font-size:1.1rem;font-weight:800;white-space:nowrap;transform:rotate(8deg)}
.hero__sticker2{position:absolute;left:-26px;top:-16px;padding:6px 14px;border:var(--border);border-radius:999px;background:var(--blue);box-shadow:var(--shadow-sm);font-family:var(--font-ru);font-weight:800;transform:rotate(-10deg);white-space:nowrap}
.hero__chip{display:inline-block;padding:3px 10px;border:2px solid var(--ink);border-radius:8px;background:var(--pink);font-family:var(--font-display);font-weight:800;font-size:.85rem;box-shadow:3px 3px 0 var(--ink);transform:rotate(-2deg)}
.hero__title{margin:14px 0 0;font-family:var(--font-display);font-size:clamp(5rem,17vw,11rem);font-weight:800;line-height:.8;letter-spacing:-.06em}
.hero__lead{max-width:34ch;margin:22px 0 0;font-size:clamp(1.15rem,2.4vw,1.5rem);font-weight:700;line-height:1.3}
.hero__stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.chip{display:inline-block;padding:3px 13px;border:2px solid var(--ink);border-radius:999px;background:var(--blue);font-size:.92rem;font-weight:700}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:28px}
.mode{display:flex;flex-direction:column;border:var(--border);border-radius:var(--radius);background:var(--surface);overflow:hidden;box-shadow:var(--shadow);text-decoration:none;transition:transform .15s,box-shadow .15s}
.mode:hover{transform:translate(-3px,-3px) rotate(-1deg);box-shadow:var(--shadow-lg)}
.mode__banner{display:flex;align-items:flex-end;justify-content:space-between;min-height:130px;padding:16px 20px;border-bottom:var(--border);background:var(--c)}
.mode__emoji{font-size:2.6rem;line-height:1}
.mode__num{font-family:var(--font-display);font-weight:800;font-size:.9rem;border:2px solid var(--ink);background:var(--surface);border-radius:999px;padding:1px 10px}
.mode__body{padding:16px 20px 20px;display:flex;flex-direction:column;gap:10px;flex:1}
.mode__title{margin:0;font-family:var(--font-display);font-size:1.75rem;font-weight:800;line-height:.95;letter-spacing:-.03em}
.mode__sum{margin:0;font-weight:500;flex:1}
.mode__go{font-family:var(--font-display);font-weight:800}

/* topics strip on home */
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px;margin-bottom:56px}
.topic{display:flex;flex-direction:column;gap:2px;padding:14px 16px;border:var(--border);border-radius:16px;background:var(--c);box-shadow:var(--shadow-sm);cursor:pointer;text-align:left;transition:transform .12s,box-shadow .12s}
.topic:hover{transform:translate(-2px,-2px) rotate(-1deg);box-shadow:var(--shadow)}
.topic__e{font-size:1.8rem;line-height:1}
.topic__ru{font-family:var(--font-ru);font-weight:900;font-size:1.25rem;margin-top:6px}
.topic__en{font-weight:700;font-size:.9rem}

/* gender legend */
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:24px}
.g{display:inline-block;padding:1px 10px;border:2px solid var(--ink);border-radius:999px;font-weight:800;font-size:.8rem;background:var(--gc)}

/* noun list */
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:18px}
.search{flex:1 1 240px;padding:11px 18px;border:var(--border);border-radius:999px;font:inherit;font-weight:600;background:var(--surface);box-shadow:var(--shadow-sm);outline:none}
.search:focus{background:#fffbe0}
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:18px}
.tile{position:relative;text-align:left;padding:14px 16px;border:var(--border);border-radius:16px;background:var(--surface);box-shadow:var(--shadow-sm);cursor:pointer;transition:transform .12s,box-shadow .12s;display:flex;flex-direction:column;gap:3px}
.tile:hover{transform:translate(-2px,-2px) rotate(-.6deg);box-shadow:var(--shadow);background:var(--gc)}
.tile__e{font-size:2rem;line-height:1.1;min-height:2.2rem}
.tile__ru{font-family:var(--font-ru);font-weight:800;font-size:1.35rem;line-height:1.1}
.tile__en{font-weight:600;color:var(--muted);font-size:.92rem}
.tile:hover .tile__en{color:var(--ink)}
.tile__tags{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.tile__star{position:absolute;top:10px;right:12px}
.groupsec{margin-bottom:44px}
.grouphead{display:flex;align-items:center;gap:12px;margin:0 0 16px;font-family:var(--font-display);font-weight:800;font-size:1.8rem;letter-spacing:-.02em}
.grouphead .ru{font-weight:900}
.grouphead .badge{padding:2px 12px;border:var(--border);border-radius:12px;background:var(--c);box-shadow:3px 3px 0 var(--ink);transform:rotate(-2deg)}

/* modal */
.modal{position:fixed;inset:0;z-index:50;display:none;place-items:center;padding:16px;background:rgba(13,13,13,.45)}
.modal.is-open{display:grid}
.modal__box{position:relative;width:min(540px,100%);max-height:92vh;overflow:auto;border:var(--border);border-radius:24px;background:var(--surface);box-shadow:var(--shadow-lg);animation:pop .22s ease}
@keyframes pop{from{transform:scale(.9) rotate(-2deg);opacity:0}}
.modal__close{position:absolute;top:14px;right:14px}
.detail__head{padding:26px 28px 22px;border-bottom:var(--border);background:var(--gc)}
.detail__e{font-size:3.4rem;line-height:1}
.detail__ru{margin:8px 0 0;font-family:var(--font-ru);font-size:clamp(2.2rem,8vw,3.2rem);font-weight:900;line-height:1}
.detail__en{margin:6px 0 0;font-weight:700;font-size:1.15rem}
.detail__body{padding:22px 28px 28px;display:flex;flex-direction:column;gap:20px}
.label{font-family:var(--font-display);font-weight:800;font-size:.85rem;text-transform:uppercase;letter-spacing:.06em;margin:0 0 8px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fact{padding:10px 14px;border:2px solid var(--ink);border-radius:12px;background:var(--bg)}
.fact b{display:block;font-family:var(--font-ru);font-size:1.25rem}
.fact span{font-weight:700;color:var(--muted);font-size:.85rem}
.example{padding:14px 16px;border:2px dashed var(--ink);border-radius:14px;background:#fffbe0}
.example p{margin:0}
.example .ru{font-weight:700;font-size:1.15rem}
.note{padding:12px 16px;border:2px solid var(--ink);border-radius:14px;background:var(--lilac);font-weight:600}

/* games */
.game{max-width:760px;margin:0 auto}
.game__bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.progress{flex:1 1 200px;height:20px;border:var(--border);border-radius:999px;background:var(--surface);overflow:hidden}
.progress__fill{height:100%;background:var(--green);border-right:3px solid var(--ink);transition:width .3s;width:0}
.score{font-family:var(--font-display);font-weight:800;font-size:1.2rem;padding:4px 14px;border:var(--border);border-radius:999px;background:var(--yellow);box-shadow:3px 3px 0 var(--ink)}
.stage{padding:32px;border:var(--border);border-radius:24px;background:var(--surface);box-shadow:var(--shadow-lg);text-align:center}
.stage--pink{background:var(--pink)}
.bigword{font-family:var(--font-ru);font-weight:900;font-size:clamp(2.4rem,9vw,3.8rem);line-height:1;margin:6px 0}
.bigemoji{font-size:clamp(4rem,14vw,6rem);line-height:1.1}
.gloss{font-weight:600;color:var(--muted);margin-bottom:20px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.choices--4{grid-template-columns:repeat(4,1fr)}
.choice{padding:16px 10px;border:var(--border);border-radius:16px;background:var(--bg);font-family:var(--font-ru);font-size:1.3rem;font-weight:800;cursor:pointer;box-shadow:var(--shadow-sm);transition:transform .1s;line-height:1.15}
.choice small{display:block;font-family:var(--font-body);font-size:.75rem;font-weight:700;color:var(--muted);margin-top:4px}
.choice:hover{transform:translate(-2px,-2px);background:var(--yellow)}
.choice.ok{background:var(--green)} .choice.bad{background:var(--red);animation:shake .35s}
.choice:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.feedback{min-height:1.8em;margin:16px 0 4px;font-weight:700;font-size:1.05rem}
.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:16px}
.toggle-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:18px}
.answer{width:100%;max-width:380px;padding:14px 20px;border:var(--border);border-radius:16px;font-family:var(--font-ru);font-size:1.6rem;font-weight:800;text-align:center;outline:none;background:var(--bg)}
.answer:focus{background:#fffbe0}
.answer.ok{background:var(--green)} .answer.bad{background:var(--red);animation:shake .35s}
.kbd{display:flex;flex-direction:column;gap:6px;align-items:center;margin-top:22px}
.kbd__row{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.key{min-width:36px;height:40px;padding:0 6px;border:2px solid var(--ink);border-radius:9px;background:var(--bg);font-family:var(--font-ru);font-weight:800;font-size:1.05rem;cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
.key:active{transform:translate(2px,2px);box-shadow:none}
.key--wide{min-width:70px;background:var(--pink)}
.sentence{font-family:var(--font-ru);font-size:clamp(1.7rem,6vw,2.6rem);font-weight:900;line-height:1.25;margin:8px 0}
.blank{display:inline-block;min-width:3.2em;border-bottom:4px solid var(--ink);line-height:1;color:transparent}
.blank.filled{color:var(--ink);background:var(--green);border-radius:8px 8px 0 0;padding:0 8px}
.odd{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.odd .choice{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 10px}
.odd .choice .e{font-size:2.4rem;line-height:1}

.flip{perspective:1200px;width:min(440px,100%);margin:0 auto;aspect-ratio:4/3;cursor:pointer}
.flip__inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d}
.flip.is-flipped .flip__inner{transform:rotateY(180deg)}
.flip__face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;border:var(--border);border-radius:24px;box-shadow:var(--shadow-lg);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flip__front{background:var(--gc,var(--pink))}
.flip__back{background:var(--surface);transform:rotateY(180deg)}
.flip__big{font-family:var(--font-ru);font-weight:900;font-size:clamp(2.2rem,8vw,3.4rem);line-height:1;text-align:center}
.flip__hint{font-weight:700;font-size:.9rem;opacity:.7}
.mini{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;font-family:var(--font-ru);font-weight:700}
.mini span{padding:2px 10px;border:2px solid var(--ink);border-radius:999px;background:var(--bg);font-size:.95rem}

.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.mcard{aspect-ratio:1/1;perspective:800px;cursor:pointer;border:0;background:none;padding:0}
.mcard__inner{position:relative;width:100%;height:100%;transition:transform .4s;transform-style:preserve-3d}
.mcard.up .mcard__inner{transform:rotateY(180deg)}
.mcard__face{position:absolute;inset:0;display:grid;place-items:center;padding:6px;border:var(--border);border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:var(--shadow-sm);font-weight:800;line-height:1.1;text-align:center;font-size:clamp(.85rem,2.8vw,1.2rem)}
.mcard__back{background:var(--ink);color:var(--green);font-family:var(--font-display);font-size:2rem}
.mcard__front{background:var(--surface);transform:rotateY(180deg);font-size:clamp(2rem,7vw,3rem)}
.mcard__front.ru{font-family:var(--font-ru);background:var(--yellow);font-size:clamp(.85rem,2.8vw,1.2rem)}
.mcard.done .mcard__front{background:var(--green)}
.mcard.done{animation:bump .4s}

.result__big{font-family:var(--font-display);font-weight:800;font-size:clamp(3.5rem,14vw,7rem);line-height:.9;letter-spacing:-.05em;margin:6px 0}
.result__msg{font-family:var(--font-ru);font-weight:800;font-size:1.5rem;margin:6px 0 4px}
.review{margin:18px auto 0;text-align:left;max-width:420px;display:flex;flex-direction:column;gap:6px}
.review div{padding:6px 12px;border:2px solid var(--ink);border-radius:10px;background:var(--bg);font-family:var(--font-ru);font-weight:600}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:28px;text-align:left}
.rule{padding:12px 14px;border:2px solid var(--ink);border-radius:14px;background:var(--gc);font-weight:600;font-size:.92rem}
.rule b{display:block;font-family:var(--font-ru);font-size:1.2rem}

.footer{border-top:var(--border);padding:28px 0;text-align:center;font-weight:600}
.burst{position:fixed;z-index:99;pointer-events:none;font-size:1.6rem;font-weight:900;animation:fly 1.3s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}

@media (max-width:760px){
  .hero{flex-direction:column;align-items:flex-start;gap:40px;padding:28px 22px}
  .hero__avatar{width:180px;font-size:6rem}
  .stage{padding:22px 16px}
  .choices{grid-template-columns:1fr}
  .choices--4{grid-template-columns:1fr 1fr}
  .facts{grid-template-columns:1fr}
  .mem{gap:8px}
  .nav{order:3;width:100%}
}

.brand{background:var(--lilac)}
.xp{background:var(--green)}
.marquee{color:var(--lilac)}
.hero__avatar{background:linear-gradient(135deg,var(--lilac),var(--pink));font-size:5.6rem;text-align:center;line-height:1}
.hero__title{font-size:clamp(3.4rem,10vw,7rem)}
.subhead{font-family:var(--font-display);font-weight:800;font-size:clamp(1.8rem,4.5vw,2.6rem);letter-spacing:-.03em;margin:0 0 12px;line-height:1}
.kinds{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:40px}
.box{padding:22px;border:var(--border);border-radius:22px;background:var(--gc,var(--surface));box-shadow:var(--shadow-lg)}
.box h3{margin:0 0 8px;font-family:var(--font-display);font-weight:800;font-size:1.6rem;letter-spacing:-.02em;line-height:1.05}
.box p,.box li{font-weight:600}
.box ul{padding-left:20px;margin:8px 0}
.box .ex{font-family:var(--font-ru);font-weight:800;margin:6px 0}
.ex .k,.cex .k{background:var(--yellow);border:2px solid var(--ink);border-radius:8px;padding:0 6px}
.ccards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;margin-bottom:40px}
.cc{padding:20px;border:var(--border);border-radius:22px;background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.cc__top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.cc__w{padding:2px 14px;border:var(--border);border-radius:14px;background:var(--gc);font-family:var(--font-ru);font-weight:900;font-size:1.8rem;box-shadow:3px 3px 0 var(--ink);transform:rotate(-2deg)}
.cc__en{font-family:var(--font-display);font-weight:800;font-size:1.2rem}
.cc .lvl{margin-left:auto}
.cex{font-family:var(--font-ru);font-weight:800;font-size:1.1rem;line-height:1.35}
.cc small{font-weight:600;color:var(--muted)}
.cc .tip{padding:8px 12px;border:2px dashed var(--ink);border-radius:12px;background:var(--bg);font-weight:600;font-size:.92rem}
.compare3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:40px}
.big-ex{padding:24px;border:var(--border);border-radius:24px;background:var(--surface);box-shadow:var(--shadow-lg);text-align:center;margin-bottom:40px}
.big-ex .row{font-family:var(--font-ru);font-weight:900;font-size:clamp(1.3rem,4vw,2rem);line-height:1.5}
.big-ex .arrow{font-family:var(--font-display);font-weight:800;font-size:1.4rem;margin:6px 0}
.big-ex .c{display:inline-block;padding:0 10px;border:var(--border);border-radius:12px;box-shadow:3px 3px 0 var(--ink)}
.rules{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.comma{color:var(--red);font-weight:900;font-size:1.3em}
/* halves */
.halves{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.halves .col{display:flex;flex-direction:column;gap:10px}
.half{padding:12px 14px;border:var(--border);border-radius:14px;background:var(--bg);font-family:var(--font-ru);font-weight:800;font-size:1.05rem;cursor:pointer;box-shadow:3px 3px 0 var(--ink);text-align:left}
.half:hover{background:var(--yellow)}
.half.sel{background:var(--blue);transform:translate(-2px,-2px)}
.half.matched{background:var(--gc);box-shadow:none;pointer-events:none}
.half.bad{background:var(--red);animation:shake .35s}
/* builder */
.tray{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:62px;padding:12px;border:3px dashed var(--ink);border-radius:18px;background:var(--bg);margin:14px 0}
.tray.ok{background:var(--green);border-style:solid} .tray.bad{background:#ffd9d0;border-style:solid}
.tok{padding:8px 14px;border:var(--border);border-radius:12px;background:var(--surface);font-family:var(--font-ru);font-weight:900;font-size:1.15rem;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.tok:hover{background:var(--yellow)}
.tok.used{visibility:hidden}
.tok.conj{background:var(--lilac)}
/* comma hunter */
.chunt{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:2px;font-family:var(--font-ru);font-weight:900;font-size:clamp(1.3rem,4.4vw,1.9rem);margin:18px 0}
.gap{width:30px;height:46px;border:2px dashed transparent;border-radius:10px;background:none;cursor:pointer;font-size:1.6rem;font-weight:900;color:var(--red);padding:0}
.gap:hover{border-color:var(--ink);background:var(--yellow)}
.gap.ok{background:var(--green);border:2px solid var(--ink);color:var(--ink)}
.gap.bad{background:var(--red);border:2px solid var(--ink);color:var(--ink)}
.gap:disabled{cursor:default}
.scenario{font-family:var(--font-display);font-weight:800;font-size:clamp(1.2rem,3.5vw,1.6rem);line-height:1.2;margin:6px 0 14px}
@media (max-width:760px){.kinds,.compare3,.halves{grid-template-columns:1fr}}

<script>
/* ============ DATA ============
 An apostrophe ' after a Cyrillic vowel = stress mark. {} = the gap. */
const S=s=>s.replace(/([аеиоуыэюяё])'/gi,'$1́');
const plain=s=>s.replace(/́/g,'');
/* connector cards for the "more" lesson */
const MORE=[
  {w:"что",en:'that',lvl:'A1',c:'var(--yellow)',ex:"Я зна'ю, *что* ты до'ма.",exEn:'I know (that) you’re at home.',tip:"In English you can drop “that”. In Russian you <b>can’t</b>: Я ду'маю, что… Он сказа'л, что…"},
  {w:"когда'",en:'when',lvl:'A1',c:'var(--blue)',ex:"*Когда'* я был ма'леньким, я жил в Москве'.",exEn:'When I was little, I lived in Moscow.',tip:"The same word asks a question: Когда' ты придёшь? = When will you come?"},
  {w:"е'сли",en:'if',lvl:'A1',c:'var(--green)',ex:"*Е'сли* за'втра бу'дет дождь, мы бу'дем до'ма.",exEn:'If it rains tomorrow, we’ll stay at home.',tip:"Talking about the future? Use the <b>future in both parts</b>: е'сли бу'дет… (English says “if it rains”)."},
  {w:"что'бы",en:'in order to, so that',lvl:'A2',c:'var(--pink)',ex:"Я учу' ру'сский, *что'бы* чита'ть Толсто'го.",exEn:'I’m learning Russian (in order) to read Tolstoy.',tip:"что'бы + <b>infinitive</b> when it’s the same person. Don’t mix it up with что (that)!"},
  {w:"где",en:'where',lvl:'A1',c:'var(--lilac)',ex:"Я зна'ю кафе', *где* о'чень вку'сный ко'фе.",exEn:'I know a café where the coffee is really good.',tip:"For movement use куда' (where to): Я зна'ю, куда' он пошёл."},
  {w:"хотя'",en:'although',lvl:'A2',c:'var(--red)',ex:"*Хотя'* бы'ло хо'лодно, мы гуля'ли.",exEn:'Although it was cold, we went for a walk.',tip:"Like но, it shows a surprising contrast: Бы'ло хо'лодно, но мы гуля'ли."},
  {w:"пока'",en:'while',lvl:'A2',c:'var(--yellow)',ex:"*Пока'* ма'ма гото'вит, я чита'ю.",exEn:'While Mum is cooking, I’m reading.',tip:"Two things happening at the same time. (Пока'! also means “Bye!”)"}
].map(c=>({...c,w:S(c.w),ex:S(c.ex),tip:S(c.tip)}));
/* PICK IT: sentence | right | wrong options (,) | why | english | level */
const PICK=`
Я не пошёл в шко'лу, {} я боле'л.|потому' что|поэ'тому,е'сли,но|Gives the reason → потому' что.|I didn't go to school because I was ill.|A1
Я боле'л, {} не пошёл в шко'лу.|поэ'тому|потому' что,что,когда'|Gives the result → поэ'тому.|I was ill, so I didn't go to school.|A1
Я ду'маю, {} он прав.|что|что'бы,е'сли,где|After “I think / I know / he said” → что.|I think (that) he's right.|A1
{} бу'дет хоро'шая пого'да, мы пое'дем на мо'ре.|Е'сли|Потому' что,Что,Но|A condition: if… → е'сли.|If the weather is good, we'll go to the sea.|A1
{} я был ма'леньким, я люби'л мультфи'льмы.|Когда'|Е'сли,Что,Потому' что|A time in the past: when… → когда'.|When I was little, I loved cartoons.|A1
Я учу' ру'сский, {} рабо'тать в Росси'и.|что'бы|что,потому' что,когда'|A purpose + infinitive → что'бы.|I'm learning Russian in order to work in Russia.|A2
Я люблю' чай, {} мой муж лю'бит ко'фе.|а|и,и'ли,что|Two different people compared → а.|I like tea, and/whereas my husband likes coffee.|A1
Э'то до'рого, {} о'чень краси'во.|но|и'ли,потому' что,е'сли|A contrast, “but” → но.|It's expensive, but very beautiful.|A1
Ты бу'дешь чай {} ко'фе?|и'ли|а,но,что|A choice → и'ли.|Will you have tea or coffee?|A1
Ма'ма {} па'па сейча'с до'ма.|и|но,что,а|Simply adding → и.|Mum and Dad are at home now.|A1
Вот кафе', {} мы познако'мились.|где|что'бы,е'сли,потому' что|A place → где.|Here's the café where we met.|A1
{} бы'ло хо'лодно, мы гуля'ли в па'рке.|Хотя'|Потому' что,Е'сли,Что'бы|A surprising contrast: although → хотя'.|Although it was cold, we walked in the park.|A2
{} па'па спит, мы говори'м ти'хо.|Пока'|Хотя',Что,И|At the same time: while → пока'.|While Dad is sleeping, we speak quietly.|A2
Он сказа'л, {} придёт в семь.|что|что'бы,е'сли,где|After “he said” → что.|He said (that) he'd come at seven.|A1
Я не зна'ю, {} он живёт.|где|что'бы,потому' что,но|A place → где.|I don't know where he lives.|A1
Мы купи'ли биле'ты, {} пойти' в теа'тр.|что'бы|что,потому' что,и'ли|A purpose + infinitive → что'бы.|We bought tickets to go to the theatre.|A2
Я ра'да, {} ты здесь!|что|что'бы,е'сли,а|After a feeling (I'm glad that…) → что.|I'm glad (that) you're here!|A1
У меня' нет вре'мени, {} я не пойду' в кино'.|поэ'тому|потому' что,хотя',что|Gives the result → поэ'тому.|I have no time, so I won't go to the cinema.|A1
Э'то мой друг, {} живёт в Ка'зани.|кото'рый|что'бы,е'сли,где|“who” about a noun (друг) → кото'рый.|This is my friend who lives in Kazan.|A2
Позвони' мне, {} бу'дешь свобо'ден.|когда'|что'бы,потому' что,а|At the moment when you're free → когда'.|Call me when you're free.|A1
`.trim().split('\n').map(l=>{const [s,r,w,why,en,lvl]=l.split('|');return {s:S(s),r:S(r),w:w.split(',').map(S),why:S(why),en,lvl};});
/* и, а or но? */
const IAN=`
Я люблю' ко'шек {} соба'к.|и|Adding similar things → и.|I love cats and dogs.
Я люблю' ко'шек, {} брат лю'бит соба'к.|а|Two different people compared → а.|I love cats, and my brother loves dogs.
Я хочу' пойти' в кино', {} у меня' нет вре'мени.|но|There's an obstacle → но.|I want to go to the cinema, but I have no time.
Он не врач, {} учи'тель.|а|“not X, but Y” (a correction) → а.|He's not a doctor but a teacher.
Ма'ма гото'вит, {} па'па чита'ет.|а|Two people doing different things → а.|Mum is cooking, and Dad is reading.
Э'то дёшево {} хорошо'.|и|Two good things together → и.|It's cheap and good.
Э'то дёшево, {} пло'хо.|но|Good, but unexpectedly bad → но.|It's cheap, but bad.
Я живу' в Москве', {} мой друг живёт в Каза'ни.|а|Two people compared → а.|I live in Moscow, and my friend lives in Kazan.
Я уста'л, {} ещё рабо'таю.|но|Unexpected: tired, but still working → но.|I'm tired, but I'm still working.
Сего'дня я рабо'таю, {} за'втра отдыха'ю.|а|Two times compared → а.|Today I work, and tomorrow I rest.
У меня' есть брат {} сестра'.|и|Simply adding → и.|I have a brother and a sister.
Он бога'тый, {} несча'стный.|но|Unexpected contrast → но.|He's rich but unhappy.
`.trim().split('\n').map(l=>{const [s,r,why,en]=l.split('|');return {s:S(s),r,why:S(why),en};});
/* cause → effect pairs */
const CAUSE=[
  ["я уста'л","я иду' спать","I'm tired","I'm going to bed"],
  ["шёл дождь","мы оста'лись до'ма","it was raining","we stayed at home"],
  ["я голо'дный","я гото'влю у'жин","I'm hungry","I'm cooking dinner"],
  ["у меня' нет де'нег","я не покупа'ю но'вый телефо'н","I have no money","I'm not buying a new phone"],
  ["она' боле'ет","она' не рабо'тает сего'дня","she's ill","she isn't working today"],
  ["я люблю' Росси'ю","я учу' ру'сский язы'к","I love Russia","I'm learning Russian"],
  ["в ко'мнате хо'лодно","я закры'л окно'","it's cold in the room","I closed the window"],
  ["за'втра экза'мен","мы мно'го занима'емся","there's an exam tomorrow","we're studying a lot"],
  ["он опозда'л на авто'бус","он взял такси'","he missed the bus","he took a taxi"],
  ["бы'ло жа'рко","мы пошли' на пляж","it was hot","we went to the beach"]
].map(r=>[S(r[0]),S(r[1]),r[2],r[3]]);
/* halves: first half | second half | key (connector) */
const HALVES=`
Я не пошёл гуля'ть,|потому' что шёл дождь.|because
Е'сли бу'дет вре'мя,|я тебе' позвоню'.|if
Когда' я был ма'леньким,|я жил у ба'бушки.|when
Я зна'ю,|что ты лю'бишь шокола'д.|that
Она' у'чит ру'сский,|что'бы чита'ть Пу'шкина.|purpose
Я люблю' мо'ре,|а моя' сестра' лю'бит го'ры.|a
Ко'фе вку'сный,|но о'чень горя'чий.|but
Шёл дождь,|поэ'тому мы оста'лись до'ма.|so
Э'то мой друг,|кото'рый живёт в Москве'.|which
Вот парк,|где мы гуля'ем ка'ждый день.|where
Хотя' бы'ло по'здно,|мы не спа'ли.|although
Ты хо'чешь чай|и'ли ко'фе?|or
`.trim().split('\n').map((l,id)=>{const [a,b,k]=l.split('|');return {id,a:S(a),b:S(b),k};});
/* который: sentence | gender of the noun */
const KOT_F={m:"кото'рый",f:"кото'рая",n:"кото'рое",pl:"кото'рые"};Object.keys(KOT_F).forEach(k=>KOT_F[k]=S(KOT_F[k]));
const KOT=`
Э'то мой брат, {} живёт в Москве'.|m|брат|This is my brother, who lives in Moscow.
Э'то моя' сестра', {} у'чится в университе'те.|f|сестра'|This is my sister, who studies at university.
Где кафе', {} тебе' нра'вится?|n|кафе'|Where's the café that you like?
Вот кни'ги, {} мне нужны'.|pl|кни'ги|Here are the books that I need.
Я зна'ю де'вушку, {} говори'т по-кита'йски.|f|де'вушку|I know a girl who speaks Chinese.
У меня' есть друг, {} лю'бит футбо'л.|m|друг|I have a friend who loves football.
Э'то окно', {} выхо'дит в парк.|n|окно'|This is the window that looks onto the park.
Мне нра'вятся лю'ди, {} мно'го чита'ют.|pl|лю'ди|I like people who read a lot.
Где ключ, {} был на столе'?|m|ключ|Where's the key that was on the table?
Э'то пе'сня, {} всем нра'вится.|f|пе'сня|This is a song that everyone likes.
Где письмо', {} пришло' вчера'?|n|письмо'|Where's the letter that came yesterday?
Вот де'ти, {} игра'ют в па'рке.|pl|де'ти|Here are the children who are playing in the park.
`.trim().split('\n').map(l=>{const [s,g,n,en]=l.split('|');return {s:S(s),g,n:S(n),en};});
/* build it: full sentences */
const BUILD=[
  ["Я не пришёл, потому' что я боле'л.","I didn't come because I was ill."],
  ["Е'сли бу'дет тепло', мы пойдём гуля'ть.","If it's warm, we'll go for a walk."],
  ["Я ду'маю, что ру'сский язы'к краси'вый.","I think (that) Russian is beautiful."],
  ["Когда' я до'ма, я чита'ю кни'ги.","When I'm at home, I read books."],
  ["Он у'чит ру'сский, что'бы рабо'тать в Москве'.","He's learning Russian to work in Moscow."],
  ["Э'то кафе', где мы познако'мились.","This is the café where we met."],
  ["Я люблю' чай, а она' лю'бит ко'фе.","I like tea, and she likes coffee."],
  ["Шёл дождь, поэ'тому мы бы'ли до'ма.","It was raining, so we were at home."],
  ["Э'то мой друг, кото'рый живёт в Каза'ни.","This is my friend who lives in Kazan."],
  ["Хотя' бы'ло хо'лодно, мы гуля'ли.","Although it was cold, we went for a walk."]
].map(([r,e])=>[S(r),e]);
/* comma hunter: | marks where the comma goes (none = no comma) */
const HUNT=`
Я зна'ю| что ты прав.|After “I know” the что-clause needs a comma.
Мы пошли' в парк| потому' что бы'ло тепло'.|Comma before потому' что.
Е'сли бу'дет дождь| мы бу'дем до'ма.|The е'сли-part comes first, so the comma goes after it.
Я люблю' чай и ко'фе.|One и joining two words: no comma!
Когда' я был в Москве'| я ви'дел Кремль.|The когда'-part comes first, so the comma goes after it.
Он у'чится| а она' рабо'тает.|Always a comma before а.
Ты хо'чешь чай и'ли ко'фе?|One и'ли joining two words: no comma!
Э'то кни'га| кото'рая мне нра'вится.|Comma before кото'рый.
Я хоте'л позвони'ть| но забы'л.|Always a comma before но.
Она' у'чит ру'сский| что'бы жить в Росси'и.|Comma before что'бы.
Ма'ма и па'па до'ма.|One и joining two words: no comma!
Хотя' я уста'л| я рабо'таю.|The хотя'-part comes first, so the comma goes after it.
`.trim().split('\n').map(l=>{const [s,why]=l.split('|').length===3?[l.split('|').slice(0,2).join('|'),l.split('|')[2]]:l.split('|');return {s:S(s),why:S(why)};});

/* ============ HELPERS ============ */
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>[...el.querySelectorAll(s)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.random()*a.length|0];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;
const store={get(k,d){try{const v=localStorage.getItem('cn_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('cn_'+k,JSON.stringify(v))}catch(e){}}};
let xp=store.get('xp',0);
const hl=s=>esc(s).replace(/\*(.+?)\*/g,'<span class="k">$1</span>');
function addXP(n){xp+=n;store.set('xp',xp);const el=$('#xp');el.textContent='★ '+xp+' XP';el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump');}
function burst(){
  const cols=['#fe98c0','#80eb3d','#3dd0eb','#eb583d','#ffe14d'];
  for(let i=0;i<26;i++){const s=document.createElement('span');s.className='burst';s.textContent=pick(['✦','★','●','✸']);
    s.style.left=(innerWidth/2)+'px';s.style.top=(innerHeight/2)+'px';s.style.color=pick(cols);
    s.style.setProperty('--dx',(Math.random()*700-350)+'px');s.style.setProperty('--dy',(Math.random()*600-380)+'px');s.style.setProperty('--r',(Math.random()*720-360)+'deg');
    document.body.appendChild(s);setTimeout(()=>s.remove(),1400);}
}
function resultMsg(r){return S(r>=.9?"Отли'чно!":r>=.7?"Хорошо'!":r>=.4?"Неплохо'!":"Ещё раз!");}
function results(el,score,total,review,again){
  const r=score/total;if(r>=.7)burst();addXP(score);
  el.innerHTML=`<div class="stage stage--pink"><p class="result__msg">${resultMsg(r)}</p><div class="result__big">${score}/${total}</div>
    ${review.length?`<p><b>Review these:</b></p><div class="review">${review.map(x=>`<div>${x}</div>`).join('')}</div>`:'<p><b>Perfect round!</b></p>'}
    <div class="actions"><button class="btn btn--ghost" id="again">New round</button></div></div>`;
  $('#again').onclick=again;
}
function mcRound({stage,id,total,make,render}){
  let i=0,score=0,review=[],qs=make();const n=()=>Math.min(total,qs.length);
  const next=()=>{
    $('#'+id+'Score').textContent=`${score} / ${n()}`;$('#'+id+'Fill').style.width=(i/n()*100)+'%';
    if(i>=n()){results($(stage),score,n(),review,()=>{i=0;score=0;review=[];qs=make();next();});return;}
    render(qs[i],i,i===n()-1,(ok,rev)=>{if(ok)score++;else if(rev)review.push(rev);$('#'+id+'Score').textContent=`${score} / ${n()}`;},()=>{i++;next();});
  };
  next();
}
function wireChoices(isRight,onAnswer){
  $$('.choice').forEach(b=>b.onclick=()=>{
    if(b.disabled)return;const ok=isRight(b);
    $$('.choice').forEach(x=>{x.disabled=true;if(isRight(x))x.classList.add('ok');});
    if(!ok)b.classList.add('bad');
    onAnswer(ok);$('#nextWrap').style.visibility='visible';$('#nextBtn').focus();
  });
}

/* ============ LESSON: и, а, но, или ============ */
VIEWS.ianoili=el=>{
  shell(el,"и, а, но, и'ли","Four short words that join words or whole sentences. English has “and, but, or”, but Russian has <b>two</b> words for “and”: и and а.",`
    <div class="ccards">
      <div class="cc" style="--gc:var(--green)"><div class="cc__top"><span class="cc__w">и</span><span class="cc__en">and (adding)</span></div>
        <p class="cex">Ма'ма <span class="k">и</span> па'па. · Я чита'ю <span class="k">и</span> пишу'.</p><small>Simply adds things that go together.</small></div>
      <div class="cc" style="--gc:var(--blue)"><div class="cc__top"><span class="cc__w">а</span><span class="cc__en">and / while / whereas</span></div>
        <p class="cex">Я до'ма, <span class="k">а</span> брат на рабо'те.</p><small>Compares two <b>different</b> things or people side by side.</small></div>
      <div class="cc" style="--gc:var(--pink)"><div class="cc__top"><span class="cc__w">но</span><span class="cc__en">but</span></div>
        <p class="cex">Я хочу' спать, <span class="k">но</span> на'до рабо'тать.</p><small>Something unexpected, or an obstacle.</small></div>
      <div class="cc" style="--gc:var(--yellow)"><div class="cc__top"><span class="cc__w">и'ли</span><span class="cc__en">or</span></div>
        <p class="cex">Чай <span class="k">и'ли</span> ко'фе? · Сего'дня <span class="k">и'ли</span> за'втра?</p><small>A choice.</small></div>
    </div>
    <h2 class="subhead">The big question: и, а or но?</h2>
    <div class="compare3">
      <div class="box" style="--gc:var(--green)"><h3>и = plus ➕</h3><p>Things that go together, nothing surprising.</p><p class="ex">Я люблю' чай <span class="k">и</span> ко'фе.</p><p class="ex">Он у'мный <span class="k">и</span> до'брый.</p></div>
      <div class="box" style="--gc:var(--blue)"><h3>а = compare ⚖️</h3><p>Two different subjects, times or places compared, or “not X, but Y”.</p><p class="ex">Я люблю' чай, <span class="k">а</span> он лю'бит ко'фе.</p><p class="ex">Он не врач, <span class="k">а</span> учи'тель.</p></div>
      <div class="box" style="--gc:var(--pink)"><h3>но = surprise ⚡</h3><p>The second part goes against what you’d expect.</p><p class="ex">Он бога'тый, <span class="k">но</span> несча'стный.</p><p class="ex">Я уста'л, <span class="k">но</span> рабо'таю.</p></div>
    </div>
    <div class="box" style="--gc:var(--lilac);margin-bottom:40px"><h3>💡 Also useful: А ты?</h3><p>а also starts a question that switches the topic:</p><p class="ex">Я из Росси'и. <span class="k">А</span> ты? = I’m from Russia. And you?</p><p class="ex">Как дела'? — Хорошо'. <span class="k">А</span> у тебя'?</p></div>
    <div class="actions"><a class="btn btn--green" href="#ian">Practise: и, а or но? →</a><a class="btn btn--ghost" href="#why">Next: Because &amp; so</a></div>`);
};

/* ============ LESSON: because & so ============ */

    <div class="big-ex">
      <div class="row">Я уста'л, <span class="c" style="background:var(--yellow)">поэ'тому</span> я иду' спать.</div>
      <div class="arrow">cause ➡️ result · I’m tired, so I’m going to bed.</div>
      <div class="row" style="margin-top:14px">Я иду' спать, <span class="c" style="background:var(--blue)">потому' что</span> я уста'л.</div>

    </div>
    <div class="kinds">

    <div class="actions"><a class="btn btn--green" href="#cause">Practise: Cause or result? →</a><a class="btn btn--ghost" href="#more">Next: что, когда́, е́сли…</a></div>`);
};

/* ============ LESSON: more ============ */

/* ============ LESSON: который ============ */
VIEWS.kotory=el=>{

        <tr>${Object.values(KOT_F).map(w=>`<td style="padding:10px 14px;border-bottom:2px solid var(--ink);font-family:var(--font-ru);font-weight:900;font-size:1.2rem">${w}</td>`).join('')}</tr>

      </table></div>
    <div class="big-ex">
      <div class="row">Э'то мой друг. Он живёт в Москве'.</div>
      <div class="arrow">⬇️ join them ⬇️</div>

    <div class="kinds">
      <div class="box" style="--gc:var(--green)"><h3>✅ More examples</h3>

        <p class="ex">Где кафе', кото'рое ты лю'бишь?</p>

/* ============ LESSON: commas ============ */
VIEWS.commas=el=>{
  shell(el,'Commas','Russian uses <b>many more commas</b> than English. The good news: the rules are very regular.',`
    <div class="rules" style="margin-bottom:36px">
      <div class="rule" style="--gc:var(--green)"><b>Always a comma before:</b>а, но, потому' что, поэ'тому, что, когда', е'сли, что'бы, где, кото'рый, хотя', пока' (in the middle of a sentence)</div>
      <div class="rule" style="--gc:var(--yellow)"><b>Part first? Comma after it!</b>Е'сли бу'дет дождь<span class="comma">,</span> мы бу'дем до'ма.</div>
      <div class="rule" style="--gc:var(--blue)"><b>No comma:</b>one и or и'ли joining two words: чай и ко'фе · чай и'ли ко'фе</div>
      <div class="rule" style="--gc:var(--pink)"><b>Comma before и</b>when it joins two full sentences with different subjects: Пошёл дождь<span class="comma">,</span> и мы пошли' домо'й.</div>
    </div>
    <div class="box" style="--gc:var(--lilac);margin-bottom:40px"><h3>📌 Compare with English</h3>

/* ============ GAME: PICK IT ============ */

/* ============ GAME: cause or result ============ */
VIEWS.cause=el=>{
  shell(el,'Cause or result?','Is the second part the <b>reason</b> (потому́ что) or the <b>result</b> (поэ́тому)? Keys 1–2.',`<div class="game">${bar('cr')}<div id="crStage"></div></div>`);
  const P=S("потому' что"),T=S("поэ'тому");
  mcRound({stage:'#crStage',id:'cr',total:10,make:()=>shuffle(CAUSE).map(r=>({r,causeFirst:Math.random()<.5})),render:(q,i,last,answer,next)=>{
    const [c,e,cEn,eEn]=q.r;const right=q.causeFirst?T:P;
    const s=q.causeFirst?`${cap(c)}, {} ${e}.`:`${cap(e)}, {} ${c}.`;
    const en=q.causeFirst?`${cap(cEn)}, so ${eEn}.`:`${cap(eEn)} because ${cEn}.`;
    $('#crStage').innerHTML=`<div class="stage">
      <p class="sentence">${gapSent(s,right)}</p><p class="gloss">${esc(en)}</p>
      <div class="choices">${[[P,'because → reason'],[T,'so → result']].map(([w,d],j)=>`<button class="choice" data-o="${w}">${w}<small>${d} · ${j+1}</small></button>`).join('')}</div>
      <div class="feedback" id="fb"></div>${nextBtn(last)}</div>`;
    wireChoices(b=>b.dataset.o===right,ok=>{answer(ok,esc(s.replace('{}',right)));$('#blank').classList.add('filled');
      $('#fb').innerHTML=q.causeFirst?`“${esc(e)}” is the <b>result</b> → ${T}`:`“${esc(c)}” is the <b>reason</b> → ${P}`;});
    $('#nextBtn').onclick=next;
  }});
  keyChoices();
};

/* ============ GAME: join the halves ============ */
VIEWS.halves=el=>{
  shell(el,'Join the halves','Tap the beginning of a sentence, then tap its ending. Join all five!',`<div class="game"><div class="game__bar"><span class="score" id="hvRound">Round 1</span><span class="score" id="hvMis" style="background:var(--pink)">Mistakes: 0</span></div><div id="hvStage"></div></div>`);
  let round=0,mis=0,sel=null,done=0,set;
  const start=()=>{
    round++;done=0;sel=null;
    const seen=new Set();set=[];for(const h of shuffle(HALVES)){if(!seen.has(h.k)){seen.add(h.k);set.push(h);}if(set.length===5)break;}
    $('#hvRound').textContent='Round '+round;$('#hvMis').textContent='Mistakes: '+mis;
    $('#hvStage').innerHTML=`<div class="stage" style="text-align:left"><div class="halves">
      <div class="col">${shuffle(set).map(h=>`<button class="half" data-s="a" data-id="${h.id}">${esc(h.a)}</button>`).join('')}</div>
      <div class="col">${shuffle(set).map(h=>`<button class="half" data-s="b" data-id="${h.id}">${esc(h.b)}</button>`).join('')}</div>
    </div><p class="feedback" id="hvFb" style="text-align:center"></p></div>`;
    $$('.half').forEach(b=>b.onclick=()=>tap(b));
  };
  const cols=['var(--green)','var(--yellow)','var(--blue)','var(--lilac)','var(--pink)'];
  const tap=b=>{
    if(!sel||sel.dataset.s===b.dataset.s){if(sel)sel.classList.remove('sel');sel=b;b.classList.add('sel');return;}
    const a=sel;sel=null;a.classList.remove('sel');
    if(a.dataset.id===b.dataset.id){const h=HALVES[+a.dataset.id],c=cols[done%5];[a,b].forEach(x=>{x.classList.add('matched');x.style.setProperty('--gc',c);});
      done++;$('#hvFb').innerHTML=`<span class="ru">${esc(h.a)} ${esc(h.b)}</span>`;
      if(done===set.length){addXP(3);burst();$('#hvFb').innerHTML+=`<div class="actions"><button class="btn btn--green" id="hvNext">Next round →</button></div>`;$('#hvNext').onclick=start;}}
    else{mis++;$('#hvMis').textContent='Mistakes: '+mis;[a,b].forEach(x=>{x.classList.add('bad');setTimeout(()=>x.classList.remove('bad'),400);});}
  };
  start();
};

/* ============ GAME: который ============ */
VIEWS.which=el=>{
  shell(el,S("Кото'рый game"),'Look at the noun before the comma and choose the form that agrees with it. Keys 1–4.',`<div class="game">${bar('kt')}<div id="ktStage"></div></div>`);
  mcRound({stage:'#ktStage',id:'kt',total:12,make:()=>shuffle(KOT),render:(q,i,last,answer,next)=>{
    const right=KOT_F[q.g];
    $('#ktStage').innerHTML=`<div class="stage">
      <p class="sentence">${gapSent(q.s,right)}</p><p class="gloss">${esc(q.en)}</p>
      <div class="choices choices--4">${Object.values(KOT_F).map((w,j)=>`<button class="choice" data-o="${w}">${w}<small>${j+1}</small></button>`).join('')}</div>
      <div class="feedback" id="fb"></div>${nextBtn(last)}</div>`;
    wireChoices(b=>b.dataset.o===right,ok=>{answer(ok,esc(q.s.replace('{}',right)));$('#blank').classList.add('filled');
      $('#fb').innerHTML=`<b class="ru">${esc(q.n)}</b> is ${{m:'masculine',f:'feminine',n:'neuter',pl:'plural'}[q.g]} → <b>${right}</b>`;});
    $('#nextBtn').onclick=next;
  }});
  keyChoices();
};

/* ============ GAME: build it ============ */
VIEWS.build=el=>{
  shell(el,'Build it','Tap the tiles in the right order to build the sentence. Tap a tile in your sentence to send it back. Linking words are purple.',`<div class="game">${bar('bd')}<div id="bdStage"></div></div>`);
  const LINKS=['потому','что','поэтому','если','когда','чтобы','где','который','хотя','а','но','и'];
  let qs,i,score,review;
  const reset=()=>{qs=shuffle(BUILD).slice(0,8);i=0;score=0;review=[];};
  const draw=()=>{
    $('#bdScore').textContent=`${score} / ${qs.length}`;$('#bdFill').style.width=(i/qs.length*100)+'%';
    if(i>=qs.length){results($('#bdStage'),score,qs.length,review,()=>{reset();draw();});return;}
    const [sent,en]=qs[i];const toks=sent.split(' ');let chosen=[],checked=false;
    const order=shuffle(toks.map((t,k)=>k));
    $('#bdStage').innerHTML=`<div class="stage">
      <p class="scenario">${esc(en)}</p>
      <div class="tray" id="tray"></div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center" id="pool">${order.map(k=>`<button class="tok ${LINKS.includes(plain(toks[k]).replace(/[.,!?]/g,'').toLowerCase())?'conj':''}" data-k="${k}">${esc(toks[k])}</button>`).join('')}</div>
      <div class="feedback" id="fb"></div>
      <div class="actions"><button class="btn btn--ghost btn--sm" id="clr">↺ Clear</button><button class="btn btn--green" id="go">Check</button></div></div>`;
    const renderTray=()=>{$('#tray').innerHTML=chosen.map((k,j)=>`<button class="tok" data-j="${j}">${esc(toks[k])}</button>`).join('');
      $$('#tray .tok').forEach(b=>b.onclick=()=>{if(checked)return;const k=chosen.splice(+b.dataset.j,1)[0];$(`#pool .tok[data-k="${k}"]`).classList.remove('used');renderTray();});};
    $$('#pool .tok').forEach(b=>b.onclick=()=>{if(checked||b.classList.contains('used'))return;b.classList.add('used');chosen.push(+b.dataset.k);renderTray();});
    $('#clr').onclick=()=>{if(checked)return;chosen=[];$$('#pool .tok').forEach(b=>b.classList.remove('used'));renderTray();};
    $('#go').onclick=()=>{
      if(checked){i++;draw();return;}
      if(chosen.length<toks.length){$('#fb').textContent='Use all the tiles first!';return;}
      checked=true;const built=chosen.map(k=>toks[k]).join(' ');const ok=built===sent;
      $('#tray').classList.add(ok?'ok':'bad');
      if(ok){score++;$('#fb').innerHTML=S("Ве'рно! ✦");}else{review.push(esc(sent));$('#fb').innerHTML=`Correct: <span class="ru">${esc(sent)}</span>`;}
      $('#go').textContent=i===qs.length-1?'Results →':'Next →';$('#bdScore').textContent=`${score} / ${qs.length}`;
    };
  };
  reset();draw();
};

/* ============ GAME: comma hunter ============ */
VIEWS.hunt=el=>{
  shell(el,'Comma hunter','Tap the space where the comma belongs, or press “No comma” if the sentence doesn’t need one.',`<div class="game">${bar('ch')}<div id="chStage"></div></div>`);
  mcRound({stage:'#chStage',id:'ch',total:10,make:()=>shuffle(HUNT).slice(0,10),render:(q,i,last,answer,next)=>{
    const parts=q.s.split('|');const words=q.s.replace('|','').split(' ');
    const right=parts.length===2?parts[0].split(' ').length-1:-1; /* comma after word index */
    const html=words.map((w,k)=>`<span>${esc(w)}</span>${k<words.length-1?`<button class="gap hopt" data-g="${k}" aria-label="comma here">·</button>`:''}`).join('');
    $('#chStage').innerHTML=`<div class="stage">
      <div class="chunt">${html}</div>
      <div class="actions"><button class="btn btn--ghost hopt" id="noComma" data-g="-1" style="font-family:var(--font-display)">🚫 No comma</button></div>
      <div class="feedback" id="fb"></div>${nextBtn(last)}</div>`;
    $$('.hopt').forEach(b=>b.onclick=()=>{
      if(b.disabled)return;const g=+b.dataset.g,ok=g===right;
      $$('.hopt').forEach(x=>x.disabled=true);
      if(right>=0){const rb=$(`.gap[data-g="${right}"]`);rb.classList.add('ok');rb.textContent=',';}
      else $('#noComma').classList.add('btn--green');
      if(!ok){if(g>=0){b.classList.add('bad');b.textContent='✗';}else b.classList.add('btn--red');}
      answer(ok,esc(q.s.replace('|',',')));
      $('#fb').innerHTML=(ok?S("Ве'рно! "):'')+esc(q.why);
      $('#nextWrap').style.visibility='visible';$('#nextBtn').focus();
    });
    $('#nextBtn').onclick=next;
  }});
};

/* ============ INIT ============ */
$('#xp').textContent='★ '+xp+' XP';
$('#footRu').textContent=S("Учи'тесь говори'ть дли'нными предложе'ниями, потому' что э'то краси'во!");
go();
</script>
